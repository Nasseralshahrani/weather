<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محطة الطقس</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #4CAF50; }
        .temp-value { font-size: 64px; font-weight: bold; margin: 10px 0; }
        .unit { font-size: 32px; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>درجة الحرارة الحالية</h1>
        <!-- الرقم سيظهر هنا ويتحدث تلقائياً -->
        <div class="temp-value"><span id="temp">--</span><span class="unit">°C</span></div>
    </div>

    <script>
        // استبدل الـ CHANNEL_ID برقم قناتك في ThingSpeak
        const channelID = "YOUR_CHANNEL_ID"; 
        
        async function getTemperature() {
            try {
                const response = await fetch(`https://thingspeak.com{channelID}/feeds/last.json`);
                const data = await response.json();
                // field1 هو المتغير الخاص بالحرارة
                document.getElementById('temp').innerText = parseFloat(data.field1).toFixed(1);
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
            }
        }

        // تحديث القيمة كل 15 ثانية تلقائياً
        getTemperature();
        setInterval(getTemperature, 15000);
    </script>
</body>
</html>
