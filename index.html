<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة الطقس الرقمية</title>
    <style>
        /* إلغاء أي هوامش في الصفحة */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* عرض القناة العامة بالكامل لتملأ شاشة أصدقائك */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- تضمين قناتك العامة رقم 3449987 الحية مباشرة -->
    <iframe src="https://thingspeak.com"></iframe>

</body>
</html>
