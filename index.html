<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة الطقس الرقمية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212; /* خلفية داكنة جداً */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #333;
            width: 280px;
        }
        h1 { font-size: 22px; margin-bottom: 25px; color: #4CAF50; font-weight: normal; }
        .temp-container { font-size: 72px; font-weight: bold; color: #ffffff; }
        .unit { font-size: 32px; color: #888; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>درجة الحرارة الحالية</h1>
        <div class="temp-container"><span id="temp_value">--</span><span class="unit">°C</span></div>
    </div>

    <script>
        // رابط مباشر نقي لجلب آخر قيمة مسجلة بدون أي أدوات عرض خارجية
        const url = "https://thingspeak.com"; 
        
        async function fetchWeather() {
            try {
                // سحب البيانات كنص نقي لتجنب حظر المواقع ورفض الاتصال
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                // التأكد من وصول الرقم وعرضه فوراً
                if (data.field1 !== null && data.field1 !== undefined) {
                    document.getElementById('temp_value').innerText = parseFloat(data.field1).toFixed(1);
                }
            } catch (error) {
                console.log("استقبال البيانات جاري...");
            }
        }

        // تشغيل فوري عند فتح الصفحة
        fetchWeather();
        // تحديث ذكي ومستقر كل 15 ثانية متوافق مع الحساب المجاني
        setInterval(fetchWeather, 15000);
    </script>
</body>
</html>
