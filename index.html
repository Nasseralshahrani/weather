<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة الطقس الرقمية</title>
    <style>
        /* إلغاء الهوامش لجعل العداد يملأ الشاشة بالكامل */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* ضبط إطار العرض الخاص بعداد ThingSpeak */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- تضمين رابط العداد الرقمي الخاص بك مباشرة بملء الشاشة -->
    <iframe src="https://thingspeak.com"></iframe>

</body>
</html>
