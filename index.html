<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة الطقس الرقمية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* خلفية سوداء مريحة للعين */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2a2a2a;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #4CAF50; }
        .temp-value { font-size: 64px; font-weight: bold; margin: 10px 0; }
        .unit { font-size: 32px; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h1>درجة الحرارة الحالية</h1>
        <!-- الرقم سيظهر هنا ويتحدث تلقائياً بدون رفض اتصال -->
        <div class="temp-value"><span id="temp">--</span><span class="unit">°C</span></div>
    </div>

    <script>
        // رابط API المفتوح الخاص بقناتك العامة رقم 3449987
        const url = "https://thingspeak.com"; 
        
        async function getTemperature() {
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // جلب آخر قراءة مسجلة في الحقل الأول وعرضها
                if(data.feeds && data.feeds.length > 0) {
                    const lastFeed = data.feeds[0];
                    if(lastFeed.field1 !== null && lastFeed.field1 !== undefined) {
                        document.getElementById('temp').innerText = parseFloat(lastFeed.field1).toFixed(1);
                    }
                }
            } catch (error) {
                console.error("خطأ في الاتصال بالبيانات:", error);
            }
        }

        // جلب البيانات فور فتح الصفحة وتحديثها تلقائياً كل 15 ثانية
        getTemperature();
        setInterval(getTemperature, 15000);
    </script>
</body>
</html>
